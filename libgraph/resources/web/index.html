<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphX Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            padding: 30px;
        }
        
        /* Execution Control Panel */
        .control-panel {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .control-panel h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #333;
        }
        
        .state-indicator {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        
        .state-stopped {
            background: #ff6b6b;
            color: white;
        }

        .state-configured {
            background: #4c6ef5;
            color: white;
        }

        .state-initialized {
            background: #15aabf;
            color: white;
        }
        
        .state-running {
            background: #51cf66;
            color: white;
        }
        
        .state-paused {
            background: #ffd43b;
            color: #333;
        }
        
        .state-error {
            background: #ff4757;
            color: white;
        }
        
        .buttons-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-init {
            background: #4c6ef5;
            color: white;
        }
        
        .btn-init:hover {
            background: #364fd7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 110, 245, 0.4);
        }
        
        .btn-start {
            background: #51cf66;
            color: white;
        }
        
        .btn-start:hover {
            background: #2f9e44;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(81, 207, 102, 0.4);
        }
        
        .btn-run {
            background: #a8e6cf;
            color: #333;
        }
        
        .btn-run:hover {
            background: #56d679;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(86, 214, 121, 0.4);
        }
        
        .btn-stop {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-stop:hover {
            background: #c92a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }
        
        .btn-join {
            background: #748ffc;
            color: white;
        }
        
        .btn-join:hover {
            background: #5a72e4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(116, 143, 252, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Search and Filter */
        .search-filter {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* Node Table */
        .table-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f1f3f5;
            border-bottom: 2px solid #dee2e6;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: #495057;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        
        tbody tr {
            transition: background 0.3s ease;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        .edit-btn {
            background: #4c6ef5;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s ease;
        }
        
        .edit-btn:hover {
            background: #364fd7;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: #333;
        }
        
        .close-btn {
            font-size: 2em;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.3s ease;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #495057;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.95em;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e9ecef;
        }
        
        .btn-save {
            background: #51cf66;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .btn-save:hover {
            background: #2f9e44;
        }
        
        .btn-cancel {
            background: #e9ecef;
            color: #495057;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .btn-cancel:hover {
            background: #dee2e6;
        }
        
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .message.success {
            background: #d3f9d8;
            color: #2f9e44;
            border-left: 4px solid #51cf66;
        }
        
        .message.error {
            background: #ffe0e0;
            color: #c92a2a;
            border-left: 4px solid #ff6b6b;
        }
        
        footer {
            background: #f1f3f5;
            padding: 20px;
            text-align: center;
            color: #868e96;
            border-top: 1px solid #e9ecef;
        }
        
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }
            
            .buttons-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 10px;
            }
            
            .modal-content {
                width: 95%;
                margin: 20% auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 GraphX Management</h1>
            <p>Real-time Graph Control & Parameter Editing</p>
        </header>
        
        <div class="main-content">
            <!-- Execution Control Panel -->
            <div class="control-panel">
                <h2>⚙️ Execution Control</h2>
                <div id="stateIndicator" class="state-indicator state-configured">State: CONFIGURED</div>
                <div class="buttons-group">
                    <button class="btn-init" onclick="handleInit()">Init</button>
                    <button class="btn-start" onclick="handleStart()">Start</button>
                    <button class="btn-run" onclick="handleRun()">Run</button>
                    <button class="btn-stop" onclick="handleStop()">Stop</button>
                    <button class="btn-join" onclick="handleJoin()">Join</button>
                </div>
            </div>
            
            <!-- Search and Filter -->
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="🔍 Search by Node ID..." onkeyup="filterTable()">
                <input type="text" id="typeFilter" placeholder="Filter by Type..." onkeyup="filterTable()">
            </div>
            
            <!-- Message Display -->
            <div id="message" class="message"></div>
            
            <!-- Node Table -->
            <div class="table-container">
                <table id="nodesTable">
                    <thead>
                        <tr>
                            <th>Node ID</th>
                            <th>Type</th>
                            <th>Configuration</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" style="text-align: center; color: #999;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <footer>
            <p>&copy; 2026 GraphX Management Dashboard | Real-time Parameter Editing & Execution Control</p>
        </footer>
    </div>
    
    <!-- Parameter Editor Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Node Parameters</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Node ID:</label>
                <input type="text" id="modalNodeId" readonly>
            </div>
            <div class="form-group">
                <label>Node Type:</label>
                <input type="text" id="modalNodeType" readonly>
            </div>
            <div class="form-group">
                <label>Node Configuration (JSON):</label>
                <textarea id="modalConfig" placeholder='{"param": value}'></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-save" onclick="saveNodeConfig()">Save</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/v1';
        let currentNodeId = null;
        
        // Load nodes on page load
        window.addEventListener('load', function() {
            loadNodes();
            updateStateDisplay();
            startStatePolling();
        });
        
        // Fetch and display nodes
        async function loadNodes() {
            try {
                const response = await fetch(API_BASE + '/nodes');
                const data = await response.json();
                
                if (data.success) {
                    displayNodes(data.data);
                } else {
                    showMessage('Failed to load nodes: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('Error loading nodes: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        // Display nodes in table
        function displayNodes(nodes) {
            const tbody = document.getElementById('tableBody');
            
            if (!nodes || nodes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">No nodes found</td></tr>';
                return;
            }
            
            tbody.innerHTML = nodes.map(node => `
                <tr>
                    <td><strong>${node.id}</strong></td>
                    <td>${node.type}</td>
                    <td><code>${JSON.stringify(node.node_config || {}).substring(0, 50)}...</code></td>
                    <td><button class="edit-btn" onclick="openEditModal('${node.id}', '${node.type}')">Edit</button></td>
                </tr>
            `).join('');
        }
        
        // Filter table based on search
        function filterTable() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const nodeId = row.cells[0].textContent.toLowerCase();
                const nodeType = row.cells[1].textContent.toLowerCase();
                
                const idMatch = nodeId.includes(searchInput);
                const typeMatch = typeFilter === '' || nodeType.includes(typeFilter);
                
                row.style.display = (idMatch && typeMatch) ? '' : 'none';
            });
        }
        
        // Open parameter editor modal
        async function openEditModal(nodeId, nodeType) {
            currentNodeId = nodeId;
            document.getElementById('modalNodeId').value = nodeId;
            document.getElementById('modalNodeType').value = nodeType;
            
            try {
                const response = await fetch(API_BASE + '/nodes/' + nodeId);
                const data = await response.json();
                
                if (data.success && data.data.node_config) {
                    document.getElementById('modalConfig').value = JSON.stringify(data.data.node_config, null, 2);
                } else {
                    document.getElementById('modalConfig').value = '{}';
                }
            } catch (error) {
                console.error('Error loading node config:', error);
                document.getElementById('modalConfig').value = '{}';
            }
            
            document.getElementById('editModal').style.display = 'block';
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            currentNodeId = null;
        }
        
        // Save node configuration
        async function saveNodeConfig() {
            if (!currentNodeId) return;
            
            const configText = document.getElementById('modalConfig').value;
            
            try {
                const config = JSON.parse(configText);
                const response = await fetch(API_BASE + '/nodes/' + currentNodeId, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({node_config: config})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Node configuration updated successfully', 'success');
                    closeModal();
                    loadNodes();
                } else {
                    showMessage('Error updating node: ' + (data.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                showMessage('Invalid JSON: ' + error.message, 'error');
            }
        }
        
        // Execution control handlers
        async function handleExecutionCommand(endpoint) {
            try {
                const response = await fetch(API_BASE + '/execution/' + endpoint, {method: 'POST'});
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Command executed: ' + endpoint, 'success');
                    updateStateDisplay();
                } else {
                    showMessage('Error: ' + (data.message || 'Command failed'), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function handleInit() { handleExecutionCommand('init'); }
        function handleStart() { handleExecutionCommand('start'); }
        function handleRun() { handleExecutionCommand('run'); }
        function handleStop() { handleExecutionCommand('stop'); }
        function handleJoin() { handleExecutionCommand('join'); }
        
        // Poll execution state
        function startStatePolling() {
            setInterval(updateStateDisplay, 1000);
        }
        
        async function updateStateDisplay() {
            try {
                const response = await fetch(API_BASE + '/execution/state');
                const data = await response.json();
                
                if (data.success && data.data.state) {
                    const indicator = document.getElementById('stateIndicator');
                    const state = data.data.state;
                    
                    indicator.textContent = 'State: ' + state;
                    indicator.className = 'state-indicator state-' + state.toLowerCase();
                }
            } catch (error) {
                console.error('Error updating state:', error);
            }
        }
        
        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
