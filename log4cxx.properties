# Log4CXX Configuration for GraphLib
# Place this file in your working directory or specify path via Logger::InitializeFromFile()

# Root logger configuration
log4j.rootLogger=TRACE, console, file

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} [%p] %c - %m%n

# File appender
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=graphlib.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=5
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{ISO8601} [%p] %c - %m%n

# Logger levels for specific components
log4j.logger.graph.GraphExecutor=TRACE
log4j.logger.graphlib.scheduler=DEBUG
log4j.logger.graphlib.plugin=INFO
log4j.logger.graphlib.edge=DEBUG
log4j.logger.graphlib.node=DEBUG
log4j.logger.graph.graph=TRACE
log4j.logger.graphlib.visualization=INFO
log4j.logger.app.policies=TRACE
