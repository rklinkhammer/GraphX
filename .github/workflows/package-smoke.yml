name: Package Smoke

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja nlohmann-json eigen apache-log4cxx

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nlohmann-json3-dev libeigen3-dev liblog4cxx-dev

      - name: Configure (Ninja preset, tests off)
        run: |
          cmake --preset ninja-debug -DBUILD_TESTS=OFF

      - name: Build
        run: |
          cmake --build --preset build-debug

      - name: Install to local prefix
        run: |
          prefix="$PWD/build-ninja/ninja-debug/install-check"
          cmake --install "$PWD/build-ninja/ninja-debug" --prefix "$prefix"

      - name: Configure smoke consumer
        run: |
          prefix="$PWD/build-ninja/ninja-debug/install-check"
          cmake \
            -S "$PWD/tools/package_smoke_consumer" \
            -B "$PWD/build-ninja/ninja-debug/package-smoke" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix"

      - name: Build smoke consumer
        run: |
          cmake --build "$PWD/build-ninja/ninja-debug/package-smoke"

      - name: Run smoke consumer
        run: |
          "$PWD/build-ninja/ninja-debug/package-smoke/package_smoke_consumer"
