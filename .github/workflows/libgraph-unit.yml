name: Libgraph Unit

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  libgraph-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            gcc-14 \
            g++-14 \
            nlohmann-json3-dev \
            libeigen3-dev \
            liblog4cxx-dev \
            libgtest-dev \
            catch2 \
            python3

      - name: Configure (Linux host debug)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --preset ninja-debug-linux-host

      - name: Build libgraph unit target
        run: |
          cmake --build build-ninja/ninja-debug-linux-host --target test_libgraph_unit

      - name: Run libgraph unit tests
        run: |
          ctest --test-dir build-ninja/ninja-debug-linux-host \
            -R '^libgraph_unit$' --output-on-failure --no-tests=error
