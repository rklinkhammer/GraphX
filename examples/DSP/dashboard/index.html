<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GraphX FHSS Dashboard</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --fg: #111827;
      --muted: #4b5563;
      --card: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
    }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background: radial-gradient(circle at top right, #dcfce7, var(--bg));
      color: var(--fg);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(3px);
    }
    h1 {
      margin: 0;
      letter-spacing: 0.02em;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      padding: 16px;
    }
    .stack {
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 280px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, 0.06);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.1rem;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      padding: 8px;
    }
    summary {
      cursor: pointer;
      font-weight: 700;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
    }
    .metric-label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .metric-value {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .activity-list {
      display: grid;
      gap: 8px;
    }
    .activity-item {
      border: 1px solid var(--border);
      border-left-width: 6px;
      border-radius: 8px;
      padding: 10px;
      background: #f9fafb;
    }
    .activity-title {
      font-weight: 700;
    }
    .activity-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      color: white;
    }
    .schedule-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .schedule-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #f9fafb;
    }
    .schedule-title {
      font-weight: 700;
    }
    .schedule-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(44px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .heat-cell {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #1f2937;
      min-height: 42px;
      display: grid;
      place-items: center;
    }
    .timeline-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-top: 8px;
    }
    .timeline-table th,
    .timeline-table td {
      border: 1px solid var(--border);
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .timeline-table th {
      background: #f3f4f6;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.68rem;
    }
    .subtle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>GraphX FHSS Dashboard</h1>
    <div id="meta"></div>
  </header>
  <div class="layout">
    <div class="stack">
      <section class="card">
        <h2>Runtime Metrics</h2>
        <div id="metrics" class="metrics-grid"></div>
      </section>
      <section class="card">
        <h2>Nodes</h2>
        <div id="nodes"></div>
      </section>
      <section class="card">
        <h2>Topology Activity</h2>
        <div id="activity" class="activity-list"></div>
      </section>
      <section class="card">
        <h2>FHSS Schedule</h2>
        <div id="schedule-meta" class="subtle"></div>
        <div id="schedule" class="schedule-list"></div>
      </section>
    </div>
    <div class="stack">
      <section class="card">
        <h2>Diagnostics</h2>
        <div id="diagnostics"></div>
      </section>
      <section class="card">
        <h2>64-Channel Heatmap</h2>
        <div id="heatmap-meta" class="subtle"></div>
        <div id="heatmap" class="heatmap-grid"></div>
      </section>
      <section class="card">
        <h2>Expected / Detected Pulse Timeline</h2>
        <div id="timeline-meta" class="subtle"></div>
        <div id="timeline"></div>
      </section>
      <section class="card">
        <h2>Edges</h2>
        <pre id="edges"></pre>
      </section>
    </div>
  </div>
  <script>
    function nodeTitle(node, index) {
      const id = typeof node.id === 'string' ? node.id : `node_${index}`;
      const type = typeof node.type === 'string' ? node.type : 'unknown';
      return `${id} (${type})`;
    }

    function formatValue(value) {
      if (typeof value === 'number') {
        return value.toLocaleString();
      }
      return String(value);
    }

    function renderMetrics(metrics) {
      const host = document.getElementById('metrics');
      host.textContent = '';
      const entries = [
        ['Processed', metrics.total_items_processed || 0],
        ['Rejected', metrics.total_items_rejected || 0],
        ['Messages', metrics.total_messages_processed || 0],
        ['Enqueued', metrics.graph_total_enqueued || 0],
        ['Dequeued', metrics.graph_total_dequeued || 0],
        ['Backpressure', metrics.backpressure_events || 0],
        ['Peak Queue', metrics.peak_queue_depth || 0],
        ['Peak Threads', metrics.peak_active_threads || 0]
      ];
      entries.forEach(([label, value]) => {
        const card = document.createElement('div');
        card.className = 'metric';
        const metricLabel = document.createElement('span');
        metricLabel.className = 'metric-label';
        metricLabel.textContent = label;
        const metricValue = document.createElement('span');
        metricValue.className = 'metric-value';
        metricValue.textContent = formatValue(value);
        card.appendChild(metricLabel);
        card.appendChild(metricValue);
        host.appendChild(card);
      });
    }

    function renderActivity(nodes, edges) {
      const host = document.getElementById('activity');
      host.textContent = '';
      if (!nodes.length) {
        host.textContent = 'Runtime graph is not active yet.';
        return;
      }
      nodes.forEach((node) => {
        const card = document.createElement('div');
        card.className = 'activity-item';
        card.style.borderLeftColor = node.activity_color || '#9ca3af';

        const title = document.createElement('div');
        title.className = 'activity-title';
        title.textContent = `${node.name} (${node.type})`;

        const meta = document.createElement('div');
        meta.className = 'activity-meta';
        meta.textContent = `in=${formatValue(node.inbound_messages || 0)} out=${formatValue(node.outbound_messages || 0)} rejected=${formatValue(node.rejected_messages || 0)} edges=${formatValue(node.connected_edges || 0)}`;

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.style.background = node.activity_color || '#9ca3af';
        badge.textContent = node.activity_state || 'idle';

        card.appendChild(title);
        card.appendChild(meta);
        card.appendChild(badge);
        host.appendChild(card);
      });

      if (edges.length) {
        const edgeSummary = document.createElement('pre');
        edgeSummary.textContent = JSON.stringify(edges, null, 2);
        host.appendChild(edgeSummary);
      }
    }

    function renderDiagnostics(nodes) {
      const host = document.getElementById('diagnostics');
      host.textContent = '';
      if (!nodes.length) {
        host.textContent = 'No diagnostics are available for the current graph state.';
        return;
      }
      nodes.forEach((node) => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = `${node.name} (${node.type})`;
        details.appendChild(summary);

        const body = document.createElement('pre');
        body.textContent = JSON.stringify(node.diagnostics, null, 2);
        details.appendChild(body);
        host.appendChild(details);
      });
    }

    function renderSchedule(schedule) {
      const host = document.getElementById('schedule');
      host.textContent = '';
      const meta = document.getElementById('schedule-meta');
      const messages = Array.isArray(schedule.messages) ? schedule.messages : [];
      const total = schedule.message_count_total || 0;
      const offset = schedule.message_offset || 0;
      const limit = schedule.message_limit || 0;
      meta.textContent = `messages ${offset + 1}-${Math.min(offset + messages.length, total)} of ${total} (page limit ${limit})`;

      if (!messages.length) {
        host.textContent = 'No schedule messages available.';
        return;
      }

      messages.forEach((message) => {
        const item = document.createElement('div');
        item.className = 'schedule-item';
        const title = document.createElement('div');
        title.className = 'schedule-title';
        title.textContent = `message ${message.message_id}`;
        const detail = document.createElement('div');
        detail.className = 'schedule-meta';
        detail.textContent = `start=${formatValue(message.transmit_start_sample)} pulses=${formatValue(message.pulse_count)} preamble=${formatValue(message.preamble_pulse_count)} body=${formatValue(message.body_pulse_count)}`;
        item.appendChild(title);
        item.appendChild(detail);
        host.appendChild(item);
      });
    }

    function colorForChannelLoad(expectedCount) {
      if (expectedCount <= 0) {
        return '#e5e7eb';
      }
      if (expectedCount < 8) {
        return '#bae6fd';
      }
      if (expectedCount < 32) {
        return '#7dd3fc';
      }
      return '#0284c7';
    }

    function renderHeatmap(heatmap) {
      const host = document.getElementById('heatmap');
      host.textContent = '';
      const meta = document.getElementById('heatmap-meta');
      const channels = Array.isArray(heatmap.channels) ? heatmap.channels : [];
      meta.textContent = `${channels.length} channels; out-of-range pulses=${formatValue(heatmap.out_of_range_pulse_count || 0)}`;

      channels.forEach((channel) => {
        const cell = document.createElement('div');
        cell.className = 'heat-cell';
        const expected = channel.expected_pulse_count || 0;
        cell.style.background = colorForChannelLoad(expected);
        cell.textContent = `${channel.channel_index}: ${expected}`;
        host.appendChild(cell);
      });
    }

    function renderTimeline(timeline) {
      const host = document.getElementById('timeline');
      host.textContent = '';
      const meta = document.getElementById('timeline-meta');
      const pulses = Array.isArray(timeline.pulses) ? timeline.pulses : [];
      meta.textContent = `pulses ${formatValue((timeline.pulse_offset || 0) + 1)}-${formatValue((timeline.pulse_offset || 0) + pulses.length)} of ${formatValue(timeline.total_pulse_count || 0)} (window ${formatValue(timeline.pulse_limit || 0)})`;

      if (!pulses.length) {
        host.textContent = 'No pulses in current timeline window.';
        return;
      }

      const table = document.createElement('table');
      table.className = 'timeline-table';
      const header = document.createElement('thead');
      header.innerHTML = '<tr><th>abs</th><th>msg</th><th>pulse</th><th>role</th><th>freq</th><th>expected</th><th>detected</th><th>conf</th><th>rejected</th></tr>';
      table.appendChild(header);
      const body = document.createElement('tbody');

      pulses.forEach((pulse) => {
        const row = document.createElement('tr');
        const detected = pulse.detected_sample_start === null ? '-' : String(pulse.detected_sample_start);
        row.innerHTML = `<td>${pulse.absolute_pulse_index}</td><td>${pulse.message_id}</td><td>${pulse.pulse_index}</td><td>${pulse.role}</td><td>${pulse.frequency_index}</td><td>${pulse.expected_sample_start}</td><td>${detected}</td><td>${Number(pulse.confidence || 0).toFixed(2)}</td><td>${pulse.rejected ? 'yes' : 'no'}</td>`;
        body.appendChild(row);
      });

      table.appendChild(body);
      host.appendChild(table);
    }

    async function fetchJson(path) {
      const response = await fetch(path);
      return response.json();
    }

    async function refreshDashboard() {
      const [graphData, metricsData, diagnosticsData, visualizationData] = await Promise.all([
        fetchJson('/api/v1/graph'),
        fetchJson('/api/v1/metrics'),
        fetchJson('/api/v1/diagnostics'),
        fetchJson('/api/v1/fhss/visualization?message_limit=16&pulse_limit=128&refresh_ms=250')
      ]);

      const graph = graphData.graph || {};
      const nodes = Array.isArray(graph.nodes) ? graph.nodes : [];
      const edges = Array.isArray(graph.edges) ? graph.edges : [];
      const nodeMetrics = Array.isArray(metricsData.nodes) ? metricsData.nodes : [];
      const edgeMetrics = Array.isArray(metricsData.edges) ? metricsData.edges : [];
      const nodeDiagnostics = Array.isArray(diagnosticsData.nodes) ? diagnosticsData.nodes : [];

      document.getElementById('meta').textContent =
        `graph=${graphData.schema} metrics=${metricsData.schema} diagnostics=${diagnosticsData.schema} fhss=${visualizationData.schema} revision=${graphData.config_revision}`;

      renderMetrics(metricsData.graph || {});
      renderActivity(nodeMetrics, edgeMetrics);
      renderDiagnostics(nodeDiagnostics);
      renderSchedule(visualizationData.schedule || {});
      renderHeatmap(visualizationData.heatmap || {});
      renderTimeline(visualizationData.timeline || {});

      const nodesHost = document.getElementById('nodes');
      nodesHost.textContent = '';
      for (let i = 0; i < nodes.length; i += 1) {
        const node = nodes[i];
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = nodeTitle(node, i);
        details.appendChild(summary);

        const body = document.createElement('pre');
        body.textContent = JSON.stringify(node, null, 2);
        details.appendChild(body);
        nodesHost.appendChild(details);
      }

      document.getElementById('edges').textContent = JSON.stringify(edges, null, 2);

      const bounds = visualizationData.bounds || {};
      const refreshMs = Math.max(100, Number(bounds.refresh_interval_ms || 250));
      window.setTimeout(() => {
        refreshDashboard().catch((err) => {
          document.getElementById('meta').textContent = `failed: ${err}`;
        });
      }, refreshMs);
    }

    refreshDashboard().catch((err) => {
      document.getElementById('meta').textContent = `failed: ${err}`;
    });
  </script>
</body>
</html>
